<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Makes the site responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Change page title -->
  <title>Customer Brand | Contact</title>

  <!-- Shared CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">

    <!-- Customer brand name -->
    <div class="logo">Customer Brand</div>

    <!-- The active class is on Contact for this page -->
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="work.html">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>

  </header>

  <main>

    <!-- Contact page heading -->
    <section class="page-heading page-animation">
      <h1>Contact Us</h1>
      <p>Use this page for email, Discord, phone number, or a contact form.</p>
    </section>

    <!-- Contact info box -->
    <section class="contact-box page-animation">

      <!-- Change these contact details per customer -->
      <p><strong>Email:</strong> customer@email.com</p>
      <p><strong>Discord:</strong> customerdiscord</p>
      <p><strong>Location:</strong> Customer Location</p>

      <!-- Basic fake form layout -->
      <form class="contact-form">

        <!-- Customer name input -->
        <input type="text" placeholder="Your Name" />

        <!-- Customer email input -->
        <input type="email" placeholder="Your Email" />

        <!-- Message input -->
        <textarea placeholder="Your Message"></textarea>

        <!-- Form button -->
        <button type="submit">Send Message</button>

      </form>

    </section>

  </main>

  <footer class="footer">
    <p>&copy; 2026 Customer Business Name. All rights reserved.</p>
  </footer>

</body>
</html>
