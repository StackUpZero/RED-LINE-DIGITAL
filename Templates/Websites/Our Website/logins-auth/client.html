<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Red_Line_Digital | Client Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f4;
      color: #0b0b0b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .client-box {
      width: 100%;
      max-width: 720px;
      border: 2px solid #111;
      border-radius: 16px;
      background: white;
      padding: 34px;
      box-shadow: 8px 8px 0 #111;
    }

    .label {
      color: #8f1d2c;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    p {
      color: #555;
      font-size: 18px;
      margin-bottom: 24px;
    }

    .status-card {
      border: 2px solid #111;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      background: #fafafa;
    }

    .status-card strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    button {
      border: 2px solid #111;
      border-radius: 999px;
      background: #111;
      color: white;
      padding: 13px 22px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 4px 4px 0 #111;
    }

    button:hover {
      background: #5f111c;
    }
  </style>
</head>

<body>

  <main class="client-box">
    <div class="label">Client Portal</div>

    <h1>Login Worked</h1>

    <p>
      You are now inside the protected client area. This page is temporary,
      just to prove Firebase login and redirect are working.
    </p>

    <div class="status-card">
      <strong>Project Status</strong>
      <span>Connected and ready for dashboard content.</span>
    </div>

    <button id="logout-button">Log Out</button>
  
    <p>Logged in as: <strong id="user-email">Checking...</strong></p>
  
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
