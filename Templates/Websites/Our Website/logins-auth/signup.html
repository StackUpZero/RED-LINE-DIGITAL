<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Red_Line_Digital | Sign Up</title>

  <link rel="stylesheet" href="signup.css" />
</head>

<body>
  <main class="signup-box">
    <h1>Create Account</h1>
    <p class="subtitle">Create your client portal login.</p>

    <form id="signup-form">
      <label for="signup-email">Email</label>
      <input
        id="signup-email"
        type="email"
        placeholder="client@email.com"
        required
      />

      <label for="signup-password">Password</label>
      <div class="password-field">
        <input
          id="signup-password"
          type="password"
          placeholder="Password"
          required
        />

        <button
          type="button"
          class="password-toggle"
          data-target="signup-password"
          aria-label="Hold to show password"
        >
          VIEW
        </button>
      </div>

      <label for="signup-confirm-password">Confirm Password</label>
      <div class="password-field">
        <input
          id="signup-confirm-password"
          type="password"
          placeholder="Confirm password"
          required
        />

        <button
          type="button"
          class="password-toggle"
          data-target="signup-confirm-password"
          aria-label="Hold to show confirm password"
        >
          VIEW
        </button>
      </div>

      <p id="signup-message"></p>

      <button class="submit-button" type="submit">Create Account</button>
    </form>

    <a class="small-link" href="login.html">Already have an account?</a>
  </main>

  <script type="module" src="signup.js"></script>
</body>
</html>
