<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Red_Line_Digital | Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f4;
      color: #0b0b0b;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      border: 2px solid #111;
      border-radius: 16px;
      background: white;
      padding: 32px;
      box-shadow: 8px 8px 0 #111;
    }

    h1 {
      font-size: 32px;
      line-height: 1;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .subtitle {
      color: #555;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      border: 2px solid #111;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 18px;
      font-size: 16px;
      font-family: inherit;
    }

    button {
      width: 100%;
      border: 2px solid #111;
      border-radius: 999px;
      background: #111;
      color: white;
      padding: 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 4px 4px 0 #111;
    }

    button:hover {
      background: #5f111c;
    }

    #login-error {
      min-height: 22px;
      color: #8f1d2c;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
    }
  </style>
</head>

<body>

  <main class="login-box">
    <h1>Client Login</h1>
    <p class="subtitle">Enter your client access details.</p>

    <form id="login-form">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        placeholder="client@email.com"
        required
      />

      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        placeholder="Password"
        required
      />

      <p id="login-error"></p>

      <button type="submit">Log In</button>
    </form>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
