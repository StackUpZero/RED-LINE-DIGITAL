<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="login.css" />

  <title>Red_Line_Digital | Login</title>
</head>

<body>
  <main class="login-box">
    <h1>Client Login</h1>
    <p class="subtitle">Enter your client access details.</p>

    <form id="login-form">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        placeholder="client@email.com"
        required
      />

      <label for="login-password">Password</label>

      <div class="password-field">
        <input
          id="login-password"
          type="password"
          placeholder="Password"
          required
        />

        <button
          type="button"
          id="show-password"
          class="password-toggle"
          aria-label="Hold to show password"
        >
          VIEW
        </button>
      </div>

      <a href="#" id="reset-password-link" class="reset-password-link">
        Forgot password?
      </a>

      <p id="login-error"></p>

      <button type="submit">Log In</button>
    </form>

    <p>
      No account yet?
      <a href="signup.html">Create account</a>
    </p>
  </main>

  <script src="login.js"></script>
</body>
</html>
